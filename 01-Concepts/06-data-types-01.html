<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primitive Data Types</title>
</head>
<body>
    <h1>Primitive Data Types</h1>
    <script>
        // data types
        // primitive data types
        // String
        let myString="Manikanta"
        console.log(myString)
        console.log(typeof myString)

        // Number
        let myNumber=23
        console.log(myNumber)
        console.log(typeof myNumber)

        // BigInt
        let largeNum=BigInt(123456789987654321123456789987654321)
        console.log(largeNum)
        console.log(typeof largeNum)
        
        // Boolean
        let isLearnJavaScript=true
        console.log(isLearnJavaScript)
        console.log(typeof isLearnJavaScript)

        // Undefined
        let greeting
        console.log(greeting)
        console.log(typeof greeting)

        // Null
        let myNull=null
        console.log(myNull)
        console.log(typeof myNull)

        // Symbols
        const sym1=Symbol("Manikanta")
        const sym2=Symbol("Manikanta")
        console.log(sym1===sym2)
    </script>
</body>
</html>
