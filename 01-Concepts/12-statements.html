<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements</title>
</head>
<body>
    <h1>Conditional Statements</h1>
    <script>
        // if statement
        let age=20
        if(age>=18){
            console.log("You are eligible!")
        }

        // if else statement
        if(age>=18){
            console.log("Adult")
        }
        else{
            console.log("Minor")
        }

        // else if statement
        let marks = 75;

        if (marks >= 90) {
            console.log("A");
        } else if (marks >= 60) {
            console.log("B");
        } else {
            console.log("C");
        }

        // Nested if statement
        let hasID = true;

        if (age >= 18) {

            if (hasID === true) {
                console.log("Entry allowed");
            }

        }

        // switch
        let day=5
        switch(day){
            case 1:{
                console.log("Monday")
                break
            }
            case 2:{
                console.log("Tuesday")
                break
            }
            case 3:{
                console.log("Wednesday")
                break
            }
            case 4:{
                console.log("Thursday")
                break
            }
            case 5:{
                console.log("Friday")
                break
            }
            case 6:{
                console.log("Saturday")
                break
            }
            case 7:{
                console.log("Sunday")
                break
            }
        }
    </script>
</body>
</html>
