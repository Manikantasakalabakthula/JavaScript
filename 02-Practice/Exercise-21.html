  <body>
    <h1>Exercise 21</h1>

    <script>
        // Write your JavaScript here
        let number = -7
        if(number>0){
            if(number%2===0){
                console.log("Positive Even")
            }
            else{
                console.log("Positive Odd")
            }
        }
        else if(number<0){
            if(number%2===0){
                console.log("Negative Even")
            }
            else{
                console.log("Negative Odd")
            }
        }
        else{
            console.log("Zero")
        }
    </script>
  </body>
